  honesty) is resolved cleanly: vp-04 description now spells out
  tempfile.mkdtemp() + os.environ['TODO_FILE'] injection and
  cites the S01 sibling test (commit 2eda53e
  tests/test_add_task.py setUp) verbatim. The mechanism matches
  todo.py:_todo_path() — the test seam exists and is the one
  the contract commits to using.

  Contract mechanics (verification depth, criterion coverage,
  threshold realism, scope match) are unchanged from R1, where
