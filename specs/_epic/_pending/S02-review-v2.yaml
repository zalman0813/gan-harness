  Deep-module dimension: todo.py stays in the framework-shaped
  applicability row (foundation §3 row 4); C2 + C4 are the
  load-bearing PASS criteria. Red flags silent on the planned
  shape.

  Verdict: APPROVE. Generator may proceed to IMPLEMENT.
