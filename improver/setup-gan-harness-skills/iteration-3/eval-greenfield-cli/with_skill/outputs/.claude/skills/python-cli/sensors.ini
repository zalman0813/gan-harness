# sensors.ini — python-cli stack sensor command contract
#
# Stack: Python CLI app using argparse (stdlib).
# Lint: Ruff. Typecheck: mypy --strict. Test: pytest.
#
# Performance budget targets per stage (advisory):
#   lint.fix    <2s    test.unit  <30s (MUST be scoped via {scope})
#   lint.check  <5s    typecheck  <30s (use incremental cache)
#
# {scope} substitution:
#   - ruff and mypy accept scoped paths directly.
#   - pytest positional args are filename filters; for gen-side
#     (changed-files mode) consider pytest-testmon if false-PASS
#     becomes a real problem. The evaluator's full L2 sweep on
#     feature.test_contract.l2_path is the real safety net.
#   - NEVER hard-code paths in place of {scope}.


[lint]
# Stage 1 of the pre-commit hook (<1s). Auto-fix in place; the
# generator commits the fixed files. gate_eval_postcommit does NOT
# run this (no in-place mutation during evaluation).
fix = ruff check --fix --silent {scope}

# Stage 2 of the pre-commit hook AND L1 of gate_eval_postcommit (<5s).
# Read-only; fail loud. No --fix.
check = ruff check {scope}


[typecheck]
# Stage 2 of the pre-commit hook AND L1 the evaluator runs directly via
# Bash. Strict mode is the project default per generator's conservative-
# defaults principle.
command = mypy --strict {scope}


[test]
# Unit / component runner. {scope} = changed files (pre-commit hook)
# or l2_path (when evaluator runs L2 directly).
unit = pytest -x --tb=short {scope}

# Optional smoke runner. Evaluator invokes this when
# feature.test_contract.l5_smoke_path is non-null. Leave EMPTY to skip
# entirely. The pre-commit hook does NOT invoke smoke — post-commit only.
smoke = pytest --no-header {scope}
