# sensors.ini — Python CLI stack sensor command contract
#
# Toolchain: Ruff + mypy --strict + pytest.
# Performance budgets (advisory):
#   lint.fix    <2s    test.unit  <30s
#   lint.check  <5s    typecheck  <30s
#
# {scope} substitution at invocation time:
#   pre-commit hook: changed files (`git diff --name-only`)
#   gate_eval_postcommit: space-joined union of module_path / l2_path / l5_smoke_path

[lint]
# Stage 1 of pre-commit (<1s): auto-fix in place, commit the fixed files.
fix = ruff check --fix --silent {scope}

# Stage 2 of pre-commit AND evaluator L1 (<5s): read-only, no --fix.
check = ruff check {scope}


[typecheck]
# Production-faithful: mypy --strict against the whole package.
# {scope} is passed through; pre-commit hook narrows to changed files,
# evaluator passes the relevant module paths.
command = mypy --strict {scope}


[test]
# Pytest. {scope} = changed files (pre-commit) or l2_path (evaluator).
# Note: pytest has no first-class source→test mapping (unlike vitest's
# --related or jest's --findRelatedTests). With changed source files,
# pytest will match zero tests and pass; evaluator's full L2 sweep over
# l2_path is the real safety net. See
# .claude/skills/stack-skill-creator/references/sensors-contract.md
# "Known limitation: dual-consumer scope semantics".
unit = pytest -x --tb=short {scope}

# Optional smoke runner. Empty = skip silently.
smoke =
