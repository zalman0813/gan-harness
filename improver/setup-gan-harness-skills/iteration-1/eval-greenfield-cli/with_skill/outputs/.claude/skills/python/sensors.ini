# sensors.ini — Python stack sensor command contract
#
# Consumed by .git/hooks/pre-commit and by evaluator's L1/L2 Bash calls.
# {scope} is substituted at invocation time:
#   - pre-commit hook: changed files (git diff --name-only)
#   - evaluator: union of module_design[*].module_path / l2_path / l5_smoke_path
#
# Performance budget targets (advisory):
#   lint.fix   <2s     test.unit  <30s (MUST scope via {scope})
#   lint.check <5s     typecheck  <30s


[lint]
# <1s budget — auto-fix in place; generator commits the fixed files.
# gate_eval_postcommit does NOT run this (no mutation during evaluation).
fix = ruff check --fix --silent {scope}

# <5s budget — read-only verify; no --fix.
check = ruff check {scope}


[typecheck]
# Strict typecheck — matches what a production "build" step would catch
# for a Python project. Pre-commit hook + evaluator both invoke this.
command = mypy --strict {scope}


[test]
# pytest-testmon (or similar) is NOT assumed; for the pre-commit case,
# {scope} = changed files, which works when test files themselves change
# but is weakly correlated when only source files change. Evaluator's L2
# sweep over l2_path is the real safety net (see sensors-contract.md
# "Known limitation: dual-consumer scope semantics").
unit = pytest -x --tb=short {scope}

# Optional smoke runner. Evaluator invokes when l5_smoke_path is non-null.
# Pre-commit hook does NOT invoke smoke (post-commit only).
smoke = pytest --no-header {scope}
