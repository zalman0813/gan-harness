# sensors.ini — python-cli stack sensor command contract
#
# Stack: Python CLI (argparse / click / typer) with Ruff + mypy --strict + pytest.
#
# Performance budget targets per stage (advisory, not enforced by code):
#   lint.fix    <2s    test.unit  <30s (MUST be scoped via {scope}, not whole suite)
#   lint.check  <5s    typecheck  <30s (use incremental cache where available)
#
# {scope} substitution:
#   - pre-commit hook: changed files (`git diff --name-only`)
#   - gate_eval_postcommit: space-joined union of spec.module_design[*].module_path /
#     l2_path / l5_smoke_path

[lint]
# Stage 1 of the pre-commit hook (<1s budget). Auto-fix in place; the
# generator commits the fixed files. gate_eval_postcommit does NOT run this.
fix = ruff check --fix --silent {scope}

# Stage 2 of the pre-commit hook AND L1 of gate_eval_postcommit (<5s budget).
# Read-only; fail loud. No --fix.
check = ruff check {scope}


[typecheck]
# Stage 2 of pre-commit hook AND L1 the evaluator runs directly via Bash.
# Strict mode is the project default per generator's conservative-defaults
# principle. Loosen only with cause.
command = mypy --strict {scope}


[test]
# Unit / component runner. {scope} = changed files (pre-commit hook) or
# l2_path (when evaluator runs L2 directly).
#
# Note (dual-consumer scope, see references/sensors-contract):
# pytest has no built-in source->test mapping. For pre-commit (changed
# files include source files), pytest's positional filter is substring
# match — source files won't match test filenames and 0 tests will be
# selected. The GAN-pattern default is: accept gen-side weakness and
# rely on evaluator's full L2 sweep. Consider pytest-testmon if false-
# PASS becomes a real problem.
unit = pytest -x --tb=short {scope}

# Optional smoke runner. CLI smoke tests typically invoke the entry
# point via subprocess. Leave configured; evaluator decides whether
# to run based on feature.test_contract.l5_smoke_path.
smoke = pytest --no-header {scope}
