# sensors.ini — AWS Strands Agents (Python) stack sensor command contract
#
# Stack: aws-strands (Python >=3.10, Strands Agents SDK)
# Toolchain: Ruff (lint) + mypy (typecheck) + pytest (test, including the
# strands-agents-evals deterministic evaluators when authored as pytest
# functions).
#
# {scope} substitution:
#   - pre-commit hook: changed files from `git diff --name-only`
#   - gate_eval_postcommit: space-joined union of
#     spec.module_design[*].module_path / l2_path / l5_smoke_path
#
# pytest has no built-in source->test mapping. The harness accepts the
# gen-side weakness (per references/sensors-contract.md "dual-consumer
# scope semantics") and relies on the evaluator L2 sweep as the safety
# net. Stays at `pytest -x --tb=short {scope}` to mirror the template.


[lint]
# Stage 1 of pre-commit (<1s budget). Ruff auto-fix; generator commits
# the fixed files. gate_eval_postcommit does NOT run this (no in-place
# mutation during evaluation).
fix = ruff check --fix --silent {scope}

# Stage 2 of pre-commit AND L1 of gate_eval_postcommit (<5s budget).
# Read-only; fail loud. No --fix.
check = ruff check {scope}


[typecheck]
# Stage 2 of pre-commit AND L1 the evaluator runs directly via Bash.
# Strict mode is the project default. Strands' `@tool` decorator relies
# on accurate Python type hints to publish the tool spec to the LLM —
# mypy --strict here also enforces that contract at gate time.
command = mypy --strict {scope}


[test]
# Unit / component runner. Property-based tests (via Hypothesis) and
# strands-agents-evals deterministic evaluators (Equals, Contains,
# ToolCalled) run as ordinary pytest functions through this same command.
# {scope} = changed files (pre-commit) or l2_path (evaluator L2).
unit = pytest -x --tb=short {scope}

# Optional smoke runner. Evaluator invokes this when
# feature.test_contract.l5_smoke_path is non-null. For a Strands agent
# smoke run, the typical L5 is a small end-to-end script that invokes
# Agent(...) against a mocked or live model provider.
smoke = pytest --no-header {scope}
